<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Prosty skaner NFC</title>
</head>
<body>
  <button id="scanBtn">Skanuj NFC</button>
  <pre id="log">Kliknij, aby rozpocząć skanowanie.</pre>

  <script>
    const log = document.getElementById('log');
    const btn = document.getElementById('scanBtn');

    if (!('NDEFReader' in window)) {
      log.textContent = "Web NFC nie jest obsługiwane w tej przeglądarce.";
      btn.disabled = true;
    }

    btn.addEventListener('click', async () => {
      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        log.textContent = "Skanowanie włączone – zbliż tag NFC.";
        ndef.onreading = event => {
          const decoder = new TextDecoder();
          let text = "";
          for (const record of event.message.records) {
            text += decoder.decode(record.data) + "\n";
          }
          log.textContent = "Odczytano tag:\n" + text;
        };
      } catch (err) {
        log.textContent = "Błąd: " + err;
      }
    });
  </script>
</body>
</html>
